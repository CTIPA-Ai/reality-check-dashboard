name: Update dashboard data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths: ["config.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch live data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: node scripts/update-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "Nothing to commit"
          else
            git config user.name  "dashboard-bot"
            git config user.email "dashboard-bot@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "Update dashboard data"
            git push
          fi
